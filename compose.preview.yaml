# Single trusted operator, SSH tunnel only. No public ingress.
x-common: &common
  restart: "no"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  logging:
    driver: json-file
    options: {max-size: "5m", max-file: "2"}
  networks: [routing]
  tmpfs: [/tmp:size=64m]
x-otp: &otp
  <<: *common
  image: eclipse-temurin:25.0.3_9-jre-noble@sha256:1a99f30a84d58729f1184c1c693f25fb6f91970ddf05395515540bc5773b8edd
  user: "10001:10001"
  mem_limit: 1536m
  memswap_limit: 1536m
  cpus: 0.75
  entrypoint: [java, -Xmx1G, -jar, /inputs/otp-shaded-2.10.0.jar]
  volumes:
    - type: bind
      source: ${PREVIEW_DATA:?Set absolute path to verified private data}
      target: /inputs
      read_only: true
      bind: {create_host_path: false}
  healthcheck:
    test: [CMD-SHELL, "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
    interval: 15s
    timeout: 3s
    retries: 8
    start_period: 60s
services:
  otp-transit:
    <<: *otp
    command: [--load, --serve, --bindAddress, 0.0.0.0, /inputs/graph]
  otp-bike:
    <<: *otp
    command: [--load, --serve, --bindAddress, 0.0.0.0, /inputs/bike-graph]
  app:
    <<: *common
    image: take-uta-to-work-preview:review
    build: {context: ., dockerfile: deploy/Dockerfile}
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    ports: ["127.0.0.1:8003:8003"]
    environment:
      APP_BIND: 0.0.0.0
      OTP_TRANSIT_URL: http://otp-transit:8080/otp/gtfs/v1
      OTP_BIKE_URL: http://otp-bike:8080/otp/gtfs/v1
    volumes:
      - type: bind
        source: ${PREVIEW_DATA:?Set absolute path to verified private data}
        target: /app/data
        read_only: true
        bind: {create_host_path: false}
      - results:/app/results
    depends_on:
      otp-transit: {condition: service_healthy}
      otp-bike: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/api/config', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  routing: {internal: true}
volumes:
  results:
